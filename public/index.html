<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Toolkit — everyday document tools</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="homeLink">📄 <span>PDF Toolkit</span></div>
  <div class="tagline">Files are processed and deleted — never stored or shared</div>
</header>

<main id="homeView">
  <div class="hero">
    <h1>Every document tool you need, in one place</h1>
    <p>PDF, Office, images, exam photos, Tamil OCR and fonts, GST invoices and spreadsheets. No accounts.</p>
  </div>
  <div id="toolGrid"></div>
  <div class="sysnote" id="sysNote"></div>
</main>

<main id="toolView" class="hidden">
  <button class="back" id="backBtn">&larr; All tools</button>
  <div class="tool-panel">
    <h2 id="toolTitle"></h2>
    <p class="tool-desc" id="toolDesc"></p>

    <div id="dropzone" class="dropzone">
      <p>Drag &amp; drop file(s) here, or click to choose</p>
      <input type="file" id="fileInput" hidden>
      <div id="fileList" class="file-list"></div>
    </div>

    <div id="optionsArea" class="options-area"></div>

    <div id="customArea" class="custom-area hidden"></div>

    <div id="organizeArea" class="organize-area hidden"></div>

    <button id="submitBtn" class="primary-btn" disabled>Process</button>

    <div id="statusArea" class="status-area"></div>
    <div id="resultArea" class="result-area"></div>
  </div>
</main>

<script src="/js/app.js" type="module"></script>
</body>
</html>
